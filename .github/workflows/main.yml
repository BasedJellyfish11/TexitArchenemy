name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish TexitArchenemy/TexitArchenemy.csproj -c Release -r linux-x64 --self-contained true

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 204.168.147.227 >> ~/.ssh/known_hosts

      # The running binary can't be overwritten in place (text file busy), so upload it
      # under a temp name and swap it in during the restart. If publishing ever produces
      # more files than the binary and the pdb, they need to be added here.
      - name: Upload binary
        run: |
          scp TexitArchenemy/bin/Release/net10.0/linux-x64/publish/TexitArchenemy root@204.168.147.227:/root/archenemy-bot/publish/TexitArchenemy.new
          scp TexitArchenemy/bin/Release/net10.0/linux-x64/publish/TexitArchenemy.pdb root@204.168.147.227:/root/archenemy-bot/publish/

      - name: Upload assets
        run: |
          ssh root@204.168.147.227 "mkdir -p /root/archenemy-bot/publish/Skeletons /root/archenemy-bot/publish/Venom"
          scp -r Skeletons/* root@204.168.147.227:/root/archenemy-bot/publish/Skeletons/
          scp -r Venom/* root@204.168.147.227:/root/archenemy-bot/publish/Venom/

      - name: Restart service
        run: ssh root@204.168.147.227 "mv /root/archenemy-bot/publish/TexitArchenemy.new /root/archenemy-bot/publish/TexitArchenemy && chmod +x /root/archenemy-bot/publish/TexitArchenemy && systemctl restart archenemy-bot && sleep 5 && systemctl is-active archenemy-bot"
